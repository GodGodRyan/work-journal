# 构建 Windows 安装包（NSIS）
# 触发方式：
#   1. Actions 页面手动触发（workflow_dispatch），产物在运行页 Artifacts 下载
#   2. 推送 v* 标签（如 v0.1.0），自动构建并发为 GitHub Releases 草稿
name: 构建 Windows 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 创建 Release/上传产物需要 contents 写权限；显式声明以覆盖仓库默认设置
permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      matrix:
        include:
          # x64：主流 Windows 电脑
          - target: x86_64-pc-windows-msvc
            suffix: x64
          # arm64：骁龙等 ARM 芯片的 Windows 笔记本
          - target: aarch64-pc-windows-msvc
            suffix: arm64
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Windows 安装包（${{ matrix.suffix }}）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 推送 tag 时发布 Releases（草稿，手动确认后对外可见）；手动触发时仅上传 Artifacts
          tagName: v__VERSION__
          releaseName: 工作日志 v__VERSION__
          releaseBody: Windows 安装包（NSIS，x64 与 arm64）
          releaseDraft: true
          # 只打 NSIS 安装包：WiX3 的 light.exe 处理不了中文文件名（工作日志_...msi），
          # 中文产品名 + MSI 是 Tauri 已知问题；NSIS 为 Unicode 版，中文名无碍
          args: --target ${{ matrix.target }} --bundles nsis
