# 构建三平台安装包
# 触发方式：
#   1. 推送 v* 标签：构建 Windows(x64/arm64) + macOS(universal)，并发布为 GitHub Releases 草稿
#   2. Actions 页面手动触发：仅构建，产物在运行页 Artifacts 下载
#
# 注：不用 tauri-action 发 release（它会 sanitize 中文资产文件名，工作日志_...exe 变 _...exe），
#     改为统一 release job 用 gh 上传原始文件，文件名保持中文。
name: 构建三平台安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 创建 Release 需要 contents 写权限；显式声明以覆盖仓库默认设置
permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      matrix:
        include:
          # x64：主流 Windows 电脑
          - target: x86_64-pc-windows-msvc
            suffix: x64
          # arm64：骁龙等 ARM 芯片的 Windows 笔记本
          - target: aarch64-pc-windows-msvc
            suffix: arm64
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Windows 安装包（${{ matrix.suffix }}）
        uses: tauri-apps/tauri-action@v0
        with:
          # 只打 NSIS 安装包：WiX3 的 light.exe 处理不了中文文件名（工作日志_...msi），
          # 中文产品名 + MSI 是 Tauri 已知问题；NSIS 为 Unicode 版，中文名无碍
          args: --target ${{ matrix.target }} --bundles nsis

      - name: 上传安装包（release 用）
        uses: actions/upload-artifact@v4
        with:
          name: work-journal-${{ matrix.suffix }}-setup
          # 带 --target 时产物在 target/<triple>/release/，两条路径互为保险
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # 免安装版：裸 exe 自包含（前端资源已嵌入，依赖系统 WebView2），
      # 下载后直接双击运行，无需安装向导
      - name: 上传免安装版 exe
        uses: actions/upload-artifact@v4
        with:
          name: work-journal-portable-${{ matrix.suffix }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/work-journal.exe
            src-tauri/target/release/work-journal.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin 不是 rustup 可下载目标：tauri 用这两个底层
          # 目标分别编译后 lipo 合成 universal 包，只需安装两者
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 macOS dmg（universal：Intel + Apple Silicon）
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin

      - name: 上传 dmg（release 用）
        uses: actions/upload-artifact@v4
        with:
          name: work-journal-macos-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

  # 推送 tag 时：汇总三个 job 的产物发布为 Release 草稿（手动触发时跳过）
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # gh release 需要 git 仓库上下文，必须先 checkout
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: work-journal-*
          merge-multiple: true
          path: bundles

      - name: 创建 Release 草稿
        run: |
          # merge-multiple 解压后保留目录结构（target/<triple>/release/...），
          # 需 find 递归收集文件而非 glob 目录；
          # 创建与上传拆两步：gh release create 带文件一步完成时上传偶发 404
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "工作日志 ${GITHUB_REF_NAME}" \
            --notes "Windows（x64 / arm64 安装包与免安装版）+ macOS（universal dmg，Intel 与 Apple Silicon 通用）"

      - name: 上传资产
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            $(find ./bundles -type f \( -name '*.exe' -o -name '*.dmg' \))

      - name: 列出已上传资产
        run: gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
